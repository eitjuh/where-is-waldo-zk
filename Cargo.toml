[workspace]
resolver = "2"
members = [
  "packages/zkvm/core",
  "packages/zkvm/methods",
  "packages/zkvm/methods/guest",
  "packages/zkvm/host",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = "1.3"
risc0-build = "3.0.5"
risc0-zkvm = { version = "3.0.5", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
